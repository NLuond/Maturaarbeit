; Ohne diese Zeile bezieht sich ein blosses `pio run` auf ALLE Umgebungen und
; versucht, src/main.cpp auch fuer den PC zu uebersetzen. env:native ist keine
; zweite Firmware, sondern nur der Rahmen fuer `pio test -e native`.
[platformio]
default_envs = xiaoblesense

; =====================================================================
;  Firmware fuer das Geraet
; =====================================================================
;   pio run              bauen
;   pio run -t upload    flashen
[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
lib_deps = 
    seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.3
lib_ldf_mode = deep+
lib_compat_mode = off
build_flags =
    ; -O2, nicht -Os: langsamerer Code hiesse mehr Wachzeit, und die ist der
    ; Posten, um den es geht. Kein -Ofast - es zieht -ffast-math nach und bricht
    ; die IEEE-Semantik, auf die sich die Quaternion-Normierung verlaesst.
    -O2
    ; Ungenutzten Code aus dem Binary werfen. Schrumpft den Flash-Bedarf, spart
    ; aber keinen Strom. Kein -flto: ein Fehler im generierten EI-SDK waere damit
    ; schwer zuzuordnen.
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    ; Schaltet assert() im Edge-Impulse-SDK ab.
    -DNDEBUG
    ; Cortex-M4F mit DSP-Befehlssatz und FPU: CMSIS-NN beschleunigt die
    ; Netz-Kernel (Lai, Suda & Chandra 2018). Ohne diese Zeilen schalten die
    ; uebrigen Build-Flags die Vorgabe des SDK wieder ab.
    -DEIDSP_USE_CMSIS_DSP=1
    -DEI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=1
    -I lib/ei-model
    -I lib/Filters
    -I lib/MadgwickAHRS
    -I lib/ArmOrientation
    -I lib/PinchFeatures
    -I lib/PinchClassifier
    -I lib/PinchDetector
    -I lib/OrientationPointer
    -I lib/TwistGuard
    -I lib/SleepPolicy
    -I lib/AirMouseState
    -I lib/PoseDetector
    -I lib/ScrollWheel
    -I lib/TwistToggle
    -I lib/Haptic
    -I lib/ImuReader
    -I lib/Battery
    -I lib/MouseHID
    -I lib/AirMouseController
    -I include
build_src_filter =
    +<*>
    +<../lib/ei-model/edge-impulse-sdk/>
    +<../lib/ei-model/tflite-model/>
    +<../lib/ei-model/model-parameters/>
; =====================================================================
;  PC-Tests
; =====================================================================
;   pio test -e native
;
; Laeuft auf dem Rechner, ohne Board, in Sekunden - der schnellste Weg, eine
; Aenderung an einem Policy-Modul zu pruefen, VOR dem Firmware-Build.
;
; test_framework = custom statt Unity: jede Testdatei hat ihr eigenes main() und
; meldet ueber den Exit-Code, ob sie durchgelaufen ist. Damit bleiben es genau
; die Programme, die sich auch von Hand mit g++ uebersetzen lassen.
;
; Die -I-Liste enthaelt bewusst NUR die hardwarefreien Module. Zieht eines von
; ihnen spaeter <Arduino.h>, config.h oder das EI-SDK herein, bricht dieser
; Build - und genau das soll er.
[env:native]
platform = native
test_framework = custom
; Kein Scannen von lib/: dort liegt unter anderem das generierte
; Edge-Impulse-SDK, das auf dem PC weder uebersetzbar noch gemeint ist.
lib_ldf_mode = off
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -I lib/AirMouseState
    -I lib/ArmOrientation
    -I lib/Filters
    -I lib/ImuReader
    -I lib/PinchDetector
    -I lib/PinchFeatures
    -I lib/PoseDetector
    -I lib/ScrollWheel
    -I lib/SleepPolicy
    -I lib/TwistGuard
    -I lib/TwistToggle
