; Ohne diese Zeile bezieht sich ein blosses `pio run` auf ALLE Umgebungen und
; versucht, src/main.cpp auch fuer den PC zu uebersetzen - das schlaegt beim
; ersten <Arduino.h> fehl. env:native ist keine zweite Firmware, sondern nur
; der Rahmen fuer die PC-Tests und wird ausschliesslich ueber
; `pio test -e native` angesprochen.
[platformio]
default_envs = xiaoblesense

; =====================================================================
;  Firmware fuer das Geraet
; =====================================================================
;   pio run              bauen
;   pio run -t upload    flashen
[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
lib_deps = 
    seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.3
lib_ldf_mode = deep+
lib_compat_mode = off
build_flags =
    ; -O2 statt -O1: Flash ist zu einem Viertel belegt, Platz ist also kein
    ; Argument fuer den schwaecheren Optimierer. -Ofast waere hier falsch, es
    ; zieht -ffast-math nach und bricht die IEEE-Semantik, auf die sich die
    ; Quaternion-Normierung im Madgwick-Filter verlaesst.
    -O2
    ; Ungenutzten Code aus dem Binary werfen. Das schrumpft den Flash-Bedarf,
    ; ist aber ausdruecklich KEINE Stromsparmassnahme - ein kleineres Binary
    ; verbraucht im Betrieb nicht weniger.
    ;
    ; -Os waere hier falsch: langsamerer Code hiesse mehr Wachzeit, und die
    ; Wachzeit ist der Posten, um den es geht. Kein -flto, weil das EI-SDK
    ; gross und generiert ist und ein Fehler dort schwer zuzuordnen waere.
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    ; Schaltet assert() im Edge-Impulse-SDK ab.
    -DNDEBUG
    ; Der nRF52840 ist ein Cortex-M4F mit DSP-Befehlssatz und FPU. Das EI-SDK
    ; schaltet beide Beschleunigungen fuer ARDUINO_NRF52_ADAFRUIT von sich aus
    ; ein - die bisherigen Flags haben diese Vorgabe aktiv wieder abgeschaltet.
    ; CMSIS-DSP beschleunigt die FFT der Spektralmerkmale, CMSIS-NN die
    ; Netz-Kernel (Lai, Suda & Chandra 2018).
    -DEIDSP_USE_CMSIS_DSP=1
    -DEI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=1
    -I lib/ei-model
    -I lib/Filters
    -I lib/MadgwickAHRS
    -I lib/ArmOrientation
    -I lib/PinchFeatures
    -I lib/PinchClassifier
    -I lib/PinchDetector
    -I lib/OrientationPointer
    -I lib/TwistGuard
    -I lib/SleepPolicy
    -I lib/AirMouseState
    -I lib/PoseDetector
    -I lib/ScrollJoystick
    -I lib/TwistToggle
    -I lib/Haptic
    -I lib/ImuReader
    -I lib/Battery
    -I lib/MouseHID
    -I lib/AirMouseController
    -I include
build_src_filter =
    +<*>
    +<../lib/ei-model/edge-impulse-sdk/>
    +<../lib/ei-model/tflite-model/>
    +<../lib/ei-model/model-parameters/>
; =====================================================================
;  PC-Tests
; =====================================================================
;   pio test -e native
;
; Laeuft auf dem Rechner, ohne Board, in Sekunden - der schnellste Weg, eine
; Aenderung an einem der Policy-Module zu pruefen, VOR dem Firmware-Build.
;
; test_framework = custom statt Unity: jede Testdatei hat ihr eigenes main()
; und meldet ueber den Exit-Code, ob sie durchgelaufen ist. Damit bleiben die
; Tests genau die Programme, die sich auch von Hand mit g++ uebersetzen lassen
; (die Zeile dafuer steht im Kopf jeder Testdatei) - eine zweite, an
; PlatformIO gebundene Fassung derselben Pruefungen gaebe es sonst.
;
; Die -I-Liste enthaelt bewusst NUR die hardwarefreien Module. Zieht eines von
; ihnen spaeter <Arduino.h>, config.h oder das Edge-Impulse-SDK herein, bricht
; dieser Build - und genau das soll er.
[env:native]
platform = native
test_framework = custom
; Kein Scannen von lib/: dort liegt unter anderem das generierte
; Edge-Impulse-SDK, das auf dem PC weder uebersetzbar noch gemeint ist.
lib_ldf_mode = off
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -I lib/AirMouseState
    -I lib/ArmOrientation
    -I lib/Filters
    -I lib/ImuReader
    -I lib/PinchDetector
    -I lib/PinchFeatures
    -I lib/PoseDetector
    -I lib/ScrollJoystick
    -I lib/SleepPolicy
    -I lib/TwistGuard
    -I lib/TwistToggle
